<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Management System</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
  <h2 class="mb-4">Employee Management System</h2>

  <div id="message" class="alert d-none" role="alert"></div>
  <!-- Add / Edit form -->
  <div class="card mb-4">
    <div class="card-header" id="formTitle">Add Employee</div>
    <div class="card-body">
      <form id="empForm" class="row g-3">
        <input type="hidden" id="empId" value="">
        <div class="col-md-3">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" id="name" required>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" required>
        </div>
        <div class="col-md-2">
          <label class="form-label" for="sal">Salary</label>
          <input class="form-control" id="sal" type="number" min="1" step="any" required>
        </div>
        <div class="col-md-2">
          <label class="form-label" for="dept">Department</label>
          <input class="form-control" id="dept" required>
        </div>
        <div class="col-md-2 d-flex align-items-end gap-2">
          <button class="btn btn-primary" type="submit" id="saveBtn">Save</button>
          <button class="btn btn-outline-secondary" type="button" id="cancelBtn">Cancel</button>
        </div>
      </form>
    </div>
  </div>
<input class="form-control mb-3" id="search" placeholder="Search by name, email or department">
  <!-- Employee list -->
  <div class="table-responsive">
    <table class="table table-striped table-bordered bg-white">
      <thead class="table-dark">
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Salary</th><th>Department</th><th style="width:150px">Actions</th></tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>
  // All calls go to the same server that serves this page, so no CORS setup is needed.
  const API_URL = "/employees";

  const form = document.getElementById("empForm");
  const tableBody = document.getElementById("tableBody");
  const messageBox = document.getElementById("message");

  function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "alert alert-" + type;
  }

  function hideMessage() {
    messageBox.className = "alert d-none";
  }

  // Turns an HTTP error into a friendly message
  async function errorText(res) {
    if (res.status === 401) return "Not logged in. Refresh the page and sign in.";
    if (res.status === 403) return "Only the ADMIN user can add, edit or delete employees.";
    const body = await res.text();
    return body || ("Request failed with status " + res.status);
  }

  function makeCell(row, text) {
    const td = document.createElement("td");
    td.textContent = text;   // textContent keeps the page safe from HTML injection
    row.appendChild(td);
  }

  function makeButton(label, cssClass, onClick) {
    const btn = document.createElement("button");
    btn.className = "btn btn-sm " + cssClass + " me-1";
    btn.textContent = label;
    btn.addEventListener("click", onClick);
    return btn;
  }

  async function loadEmployees() {
    const res = await fetch(API_URL);
    if (!res.ok) {
      showMessage(await errorText(res), "danger");
      return;
    }
    const employees = await res.json();
    tableBody.innerHTML = "";
    if (employees.length === 0) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 6;
      td.className = "text-center text-muted";
      td.textContent = "No employees yet";
      tr.appendChild(td);
      tableBody.appendChild(tr);
      return;
    }
    employees.forEach(function (emp) {
      const tr = document.createElement("tr");
      makeCell(tr, emp.id);
      makeCell(tr, emp.name);
      makeCell(tr, emp.email);
      makeCell(tr, emp.sal);
      makeCell(tr, emp.dept);
      const actions = document.createElement("td");
      actions.appendChild(makeButton("Edit", "btn-warning", function () { startEdit(emp); }));
      actions.appendChild(makeButton("Delete", "btn-danger", function () { removeEmployee(emp.id); }));
      tr.appendChild(actions);
      tableBody.appendChild(tr);
    });
    applySearch();
  }

  function startEdit(emp) {
    document.getElementById("empId").value = emp.id;
    document.getElementById("name").value = emp.name;
    document.getElementById("email").value = emp.email;
    document.getElementById("sal").value = emp.sal;
    document.getElementById("dept").value = emp.dept;
    document.getElementById("formTitle").textContent = "Edit Employee (ID " + emp.id + ")";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function resetForm() {
    form.reset();
    document.getElementById("empId").value = "";
    document.getElementById("formTitle").textContent = "Add Employee";
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    hideMessage();
    const id = document.getElementById("empId").value;
    const employee = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      sal: Number(document.getElementById("sal").value),
      dept: document.getElementById("dept").value.trim()
    };
    // The backend has no PUT. POST with an existing id updates that row.
    if (id) employee.id = Number(id);

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(employee)
    });
    if (!res.ok) {
      showMessage(await errorText(res), "danger");
      return;
    }
    showMessage(id ? "Employee updated" : "Employee added", "success");
    resetForm();
    loadEmployees();
  });

  async function removeEmployee(id) {
    if (!confirm("Delete employee " + id + "?")) return;
    hideMessage();
    const res = await fetch(API_URL + "/" + id, { method: "DELETE" });
    if (!res.ok) {
      showMessage(await errorText(res), "danger");
      return;
    }
    showMessage("Employee deleted", "success");
    loadEmployees();
  }

  document.getElementById("cancelBtn").addEventListener("click", function () {
    resetForm();
    hideMessage();
  });
  function applySearch() {
	  const q = document.getElementById("search").value.toLowerCase();
	  Array.from(tableBody.rows).forEach(function (row) {
	    row.style.display = row.textContent.toLowerCase().includes(q) ? "" : "none";
	  });
	}
	document.getElementById("search").addEventListener("input", applySearch);

  loadEmployees();
</script>
</body>
</html>
